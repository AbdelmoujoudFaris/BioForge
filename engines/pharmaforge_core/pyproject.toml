[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaforge_core"
version = "0.1.0"
description = "Vendored engine (from PharmaForge) powering BioForge: 3D pocket-conditioned diffusion generation, differentiable scoring, and multi-objective selectivity optimization."
readme = "UPSTREAM_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PharmaForge contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.4",
    "rdkit>=2023.9",
    "biopython>=1.81",
    "pdb2pqr>=3.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pymoo>=0.6",
    "plotly>=5.18",
    "streamlit>=1.32",
    "requests>=2.31",
    "networkx>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.0"]
retrosynthesis = ["aizynthfinder>=4.0"]
visualization = ["nglview>=3.1", "MDAnalysis>=2.6"]

[project.urls]
Homepage = "https://github.com/bioforge-oss/bioforge/tree/main/engines/pharmaforge_core"
Documentation = "https://github.com/bioforge-oss/bioforge/tree/main/engines/pharmaforge_core/docs"

[tool.setuptools.packages.find]
include = ["pharmaforge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
