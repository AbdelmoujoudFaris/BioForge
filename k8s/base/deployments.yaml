apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: bioforge
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: bioforge/bioforge:latest
          env:
            - name: SERVICE
              value: "gateway"
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef: { name: bioforge-config }
            - secretRef: { name: bioforge-secrets }
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: bioforge
spec:
  selector: { app: gateway }
  ports:
    - port: 8000
      targetPort: 8000
---
