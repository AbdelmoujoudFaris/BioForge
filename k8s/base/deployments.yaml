apiVersion: apps/v1
kind: Deployment
metadata:
  name: generate
  namespace: bioforge
  labels: { app: generate }
spec:
  replicas: 1
  selector:
    matchLabels: { app: generate }
  template:
    metadata:
      labels: { app: generate }
    spec:
      containers:
        - name: generate
          image: bioforge/bioforge:latest
          env:
            - name: SERVICE
              value: "generate"
            - name: PORT
              value: "8002"
          envFrom:
            - configMapRef: { name: bioforge-config }
            - secretRef: { name: bioforge-secrets }
          ports:
            - containerPort: 8002
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits: { cpu: "2", memory: "4Gi" }
        # nvidia.com/gpu: "1"  # uncomment once a GPU-scheduled checkpoint is wired in
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
